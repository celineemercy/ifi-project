services:
  web:
    build: .
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ifi_pulse:ifi_pulse_dev@postgres:5432/ifi_pulse?schema=public
      AUTH_SECRET: ${AUTH_SECRET:-ifi-pulse-local-demo-only-change-before-public-hosting}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_NAME: IFI Savoir-Faire Hub
    ports:
      - "${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/auth/providers').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 10

  postgres:
    image: postgres:17-alpine
    container_name: ifi-pulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ifi_pulse
      POSTGRES_USER: ifi_pulse
      POSTGRES_PASSWORD: ifi_pulse_dev
    ports:
      - "55432:5432"
    volumes:
      - ifi_pulse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ifi_pulse -d ifi_pulse"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ifi_pulse_postgres_data:
